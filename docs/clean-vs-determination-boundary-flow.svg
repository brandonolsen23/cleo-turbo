<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="600" viewBox="0 0 1720 600" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
<rect width="1720" height="600" fill="#FFFFFF"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8AA596"/></marker>
<marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1D9E75"/></marker>
</defs>

<!-- ZONES -->
<rect x="16" y="170" width="708" height="350" rx="18" fill="#EAF5EE" stroke="#C3E2CE" stroke-width="1.5"/>
<rect x="748" y="170" width="698" height="350" rx="18" fill="#EFF2F1" stroke="#D2DAD6" stroke-width="1.5"/>
<rect x="1462" y="170" width="242" height="350" rx="18" fill="#E7F3EB" stroke="#C3E2CE" stroke-width="1.5"/>
<text x="370" y="196" text-anchor="middle" font-size="13" font-weight="800" fill="#1D6B45" letter-spacing="0.5">CLEAN RECORD · EVIDENCE</text>
<text x="1097" y="196" text-anchor="middle" font-size="13" font-weight="800" fill="#4A5B52" letter-spacing="0.5">DETERMINATION · INTERPRETATION → JUDGMENT</text>
<text x="1583" y="196" text-anchor="middle" font-size="13" font-weight="800" fill="#1D6B45" letter-spacing="0.5">APP-FACING</text>

<!-- BOUNDARY -->
<line x1="736" y1="176" x2="736" y2="514" stroke="#1D9E75" stroke-width="2.5" stroke-dasharray="7 5"/>

<!-- BOUNDARY CALLOUT -->
<rect x="590" y="86" width="292" height="80" rx="12" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
<text x="736" y="106" text-anchor="middle" font-size="11" font-weight="800" fill="#1D9E75">THE LINE</text>
<text x="736" y="123" text-anchor="middle" font-size="9.5" fill="#2C2C2A">Derivable from THIS doc alone, by an</text>
<text x="736" y="136" text-anchor="middle" font-size="9.5" fill="#2C2C2A">always-right rule?  →  Clean.</text>
<text x="736" y="152" text-anchor="middle" font-size="9.5" fill="#2C2C2A">Needs geocoder / parcel / other record?  →  Determine.</text>

<!-- FEEDBACK ARC (App -> Determination) -->
<path d="M1583 250 C1583 148 1336 148 1336 170" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#fb)"/>
<text x="1470" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1D9E75">edits return as new signals</text>

<!-- FLOW ARROWS -->
<line x1="236" y1="302" x2="270" y2="302" stroke="#8AA596" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="470" y1="302" x2="504" y2="302" stroke="#8AA596" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="704" y1="302" x2="768" y2="302" stroke="#8AA596" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="968" y1="302" x2="1002" y2="302" stroke="#8AA596" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="1202" y1="302" x2="1236" y2="302" stroke="#8AA596" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="1436" y1="302" x2="1478" y2="302" stroke="#8AA596" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- BOX 1 Source -->
<rect x="36" y="250" width="200" height="104" rx="14" fill="#D7EEDD" stroke="#2E7D53" stroke-width="1.5"/>
<text x="136" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#123D28">Source Documents</text>
<text x="136" y="308" text-anchor="middle" font-size="10.5" fill="#2E4B3A">RT · GW · Web (HTML)</text>
<text x="136" y="376" text-anchor="middle" font-size="10" fill="#5A6B60">Raw HTML, kept verbatim</text>
<text x="136" y="391" text-anchor="middle" font-size="10" fill="#5A6B60">with its source + date.</text>

<!-- BOX 2 Classify -->
<rect x="270" y="250" width="200" height="104" rx="14" fill="#CDECD7" stroke="#2E7D53" stroke-width="1.5"/>
<text x="370" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#123D28">Classify &amp; Normalize</text>
<text x="370" y="308" text-anchor="middle" font-size="10.5" fill="#2E4B3A">pure function</text>
<text x="370" y="376" text-anchor="middle" font-size="10" fill="#5A6B60">Parse, normalize, classify</text>
<text x="370" y="391" text-anchor="middle" font-size="10" fill="#5A6B60">from THIS doc + fixed rules.</text>
<text x="370" y="406" text-anchor="middle" font-size="10" fill="#5A6B60">Answers: what each field IS.</text>

<!-- BOX 3 Clean Record -->
<rect x="504" y="250" width="200" height="104" rx="14" fill="#BDE8CB" stroke="#1D6B45" stroke-width="2.6"/>
<text x="604" y="286" text-anchor="middle" font-size="13.5" font-weight="800" fill="#123D28">Clean Record</text>
<text x="604" y="306" text-anchor="middle" font-size="10.5" fill="#2E4B3A">per source_id</text>
<text x="604" y="374" text-anchor="middle" font-size="10" fill="#5A6B60">All stated points, typed: every</text>
<text x="604" y="389" text-anchor="middle" font-size="10" fill="#5A6B60">address + variation, all PINs,</text>
<text x="604" y="404" text-anchor="middle" font-size="10" fill="#5A6B60">stated ARN, acreage, legal.</text>
<text x="604" y="419" text-anchor="middle" font-size="10" font-weight="700" fill="#1D6B45">Nothing dropped or decided.</text>

<!-- BOX 4 Discover -->
<rect x="768" y="250" width="200" height="104" rx="14" fill="#CDECD7" stroke="#2E7D53" stroke-width="1.5"/>
<text x="868" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#123D28">Discover</text>
<text x="868" y="308" text-anchor="middle" font-size="10.5" fill="#2E4B3A">gather all candidates</text>
<text x="868" y="376" text-anchor="middle" font-size="10" fill="#5A6B60">Geocode addresses + variants.</text>
<text x="868" y="391" text-anchor="middle" font-size="10" fill="#5A6B60">PIN→ARN. ARN→geom + acres.</text>
<text x="868" y="406" text-anchor="middle" font-size="10" fill="#5A6B60">Collect all, tagged by source.</text>

<!-- BOX 5 Reconcile -->
<rect x="1002" y="250" width="200" height="104" rx="14" fill="#CDECD7" stroke="#2E7D53" stroke-width="1.5"/>
<text x="1102" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#123D28">Reconcile</text>
<text x="1102" y="308" text-anchor="middle" font-size="10.5" fill="#2E4B3A">confidence + flags</text>
<text x="1102" y="376" text-anchor="middle" font-size="10" fill="#5A6B60">Dedupe ARNs. Stated vs geo</text>
<text x="1102" y="391" text-anchor="middle" font-size="10" fill="#5A6B60">(21% disagree). Σacres vs stated.</text>
<text x="1102" y="406" text-anchor="middle" font-size="10" fill="#5A6B60">Score + review flags.</text>

<!-- BOX 6 Resolve -->
<rect x="1236" y="250" width="200" height="104" rx="14" fill="#BDE8CB" stroke="#1D6B45" stroke-width="2.6"/>
<text x="1336" y="286" text-anchor="middle" font-size="13.5" font-weight="800" fill="#123D28">Resolve Entities</text>
<text x="1336" y="306" text-anchor="middle" font-size="10.5" fill="#2E4B3A">PRO_ · GRP_ · CON_</text>
<text x="1336" y="374" text-anchor="middle" font-size="10" fill="#5A6B60">PRO_ = 1 per distinct ARN</text>
<text x="1336" y="389" text-anchor="middle" font-size="10" fill="#5A6B60">(deterministic master). GRP_/</text>
<text x="1336" y="404" text-anchor="middle" font-size="10" fill="#5A6B60">CON_ fuzzy, on settled parcels.</text>
<text x="1336" y="419" text-anchor="middle" font-size="10" font-weight="700" fill="#1D6B45">Append-only · replayable.</text>

<!-- BOX 7 App -->
<rect x="1478" y="250" width="200" height="104" rx="14" fill="#D7EEDD" stroke="#2E7D53" stroke-width="1.5"/>
<text x="1578" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#123D28">App-Facing Data</text>
<text x="1578" y="308" text-anchor="middle" font-size="10.5" fill="#2E4B3A">read layer</text>
<text x="1578" y="376" text-anchor="middle" font-size="10" fill="#5A6B60">The one layer the app reads.</text>
<text x="1578" y="391" text-anchor="middle" font-size="10" fill="#5A6B60">Edits feed back as signals.</text>

<!-- STAGE HARDNESS STRIP under determination -->
<text x="868" y="470" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8A9990">mechanical</text>
<text x="1102" y="470" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8A9990">rules</text>
<text x="1336" y="470" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8A9990">deterministic → fuzzy</text>

<!-- BOTTOM PRINCIPLE -->
<text x="860" y="560" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123D28">Gather every derivable fact into the clean record. Decide nothing there.</text>
<text x="860" y="580" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123D28">Make every judgment in the determination layer: tagged, layered, append-only, replayable.</text>
</svg>
