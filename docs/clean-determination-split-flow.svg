<text x="642" y="349" font-size="9" fill="#7A4A12">(compile.py build_clean_record :111-131, :193).</text>
<text x="642" y="361" font-size="9" font-weight="700" fill="#7A4A12">stated site.arn stays · resolved parcel.resolved_arn moves</text>

