<text x="94" y="250" text-anchor="middle" font-size="9" fill="#2E4B3A">raw-data/rt</text>

<rect x="182" y="196" width="250" height="80" rx="12" fill="#CDECD7" stroke="#2E7D53" stroke-width="1.5"/>
<text x="307" y="226" text-anchor="middle" font-size="12" font-weight="800" fill="#123D28">RT parse stages</text>
<text x="307" y="244" text-anchor="middle" font-size="9.5" fill="#2E4B3A">extract · dedup · classify</text>
<text x="307" y="258" text-anchor="middle" font-size="9.5" fill="#2E4B3A">normalize · addresses</text>

<rect x="490" y="196" width="232" height="80" rx="12" fill="#BDE8CB" stroke="#1D6B45" stroke-width="2.6"/>
<text x="606" y="226" text-anchor="middle" font-size="13" font-weight="800" fill="#123D28">CLEAN RECORD</text>
<text x="606" y="244" text-anchor="middle" font-size="9.5" fill="#2E4B3A">clean-data/rt/{RT_ID}.json</text>
<text x="606" y="262" text-anchor="middle" font-size="9" font-weight="700" fill="#1D6B45">✎ now RT-only (pure)</text>
<text x="606" y="296" text-anchor="middle" font-size="9" fill="#5A6B60">RT-only: txn · property · seller · buyer · consideration · broker · photos</text>
<text x="606" y="309" text-anchor="middle" font-size="9" fill="#5A6B60">site (STATED pin / arn / legal / acreage)</text>

