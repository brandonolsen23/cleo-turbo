<text x="30" y="42" font-size="19" font-weight="800" fill="#123D28">Clean / Determination Split — RT pipeline</text>
<text x="30" y="64" font-size="12" fill="#5A6B60">What the build plan does: stop blending resolver + geocoder output into the clean record; produce it separately and tag provenance.</text>

<!-- ===== CLEAN LANE ===== -->
