<!-- ===== LEGEND + PRINCIPLE ===== -->
<text x="30" y="606" font-size="10" fill="#5A6B60"><tspan font-weight="800" fill="#123D28">Legend:  </tspan>solid = this plan (behavior-preserving)   ·   dashed = later phases   ·   ★ new   ·   ✎ changed   ·   green = clean/evidence, blue = determination</text>
<text x="30" y="632" font-size="11.5" font-weight="700" fill="#123D28">Clean = everything derivable from the RT alone. Determination = geocode, resolve, reconcile, entities. The split makes clean rebuildable and lets resolution re-run without re-parsing.</text>
