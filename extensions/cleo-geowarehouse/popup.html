<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; color: #1a211e; }
      h1 { font-size: 13px; margin: 0 0 8px; color: #126e57; }
      .row { display: flex; justify-content: space-between; margin: 5px 0; gap: 12px; }
      .k { color: #5b6b65; }
      .v { font-weight: 600; text-align: right; }
      .ok { color: #126e57; }
      .bad { color: #b42318; }
      .warn { color: #b8860b; }
      .path { margin-top: 10px; font-size: 11px; color: #5b6b65; word-break: break-all; }
      .muted { color: #8a948f; }
      hr { border: none; border-top: 1px solid #e3e8e5; margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>Cleo · GeoWarehouse Capture</h1>
    <div class="row"><span class="k">Captured (total)</span><span class="v" id="count">0</span></div>
    <hr />
    <div class="row"><span class="k">Active on GeoWarehouse</span><span class="v" id="alive">—</span></div>
    <div class="row"><span class="k">Last capture status</span><span class="v" id="status">—</span></div>
    <div class="row"><span class="k">Last capture</span><span class="v" id="when">—</span></div>
    <div class="row"><span class="k">Last PIN</span><span class="v" id="pin">—</span></div>
    <div class="path">Saving to: <span class="muted">Downloads/GeoWarehouse/gw-ingest-data/</span></div>
    <div class="path bad" id="err"></div>
    <script src="popup.js"></script>
  </body>
</html>
