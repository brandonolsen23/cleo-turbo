<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; color: #1a211e; }
      h1 { font-size: 13px; margin: 0 0 8px; color: #126e57; }
      .row { display: flex; justify-content: space-between; margin: 4px 0; }
      .k { color: #5b6b65; }
      .v { font-weight: 600; }
      .ok { color: #126e57; }
      .bad { color: #b42318; }
      .path { margin-top: 8px; font-size: 11px; color: #5b6b65; word-break: break-all; }
      .muted { color: #8a948f; }
    </style>
  </head>
  <body>
    <h1>Cleo · GeoWarehouse Capture</h1>
    <div class="row"><span class="k">Captured this browser</span><span class="v" id="count">0</span></div>
    <div class="row"><span class="k">Last status</span><span class="v" id="status">—</span></div>
    <div class="row"><span class="k">Last PIN</span><span class="v" id="pin">—</span></div>
    <div class="row"><span class="k">When</span><span class="v" id="when">—</span></div>
    <div class="path">Saving to: <span class="muted">Downloads/GeoWarehouse/gw-ingest-data/</span></div>
    <div class="path" id="err"></div>
    <script src="popup.js"></script>
  </body>
</html>
