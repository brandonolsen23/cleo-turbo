<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header svg { flex-shrink: 0; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header span { font-size: 11px; color: #64748b; }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      color: #1e293b;
      outline: none;
    }
    .field input:focus { border-color: #2E7D5B; box-shadow: 0 0 0 2px rgba(46, 125, 91, 0.15); }

    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary { background: #2E7D5B; color: white; }
    .btn-primary:hover { background: #246b4d; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .btn-secondary:hover { background: #e2e8f0; }

    .status {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 8px;
      display: none;
    }
    .status.success { display: block; background: #dcfce7; color: #166534; }
    .status.error { display: block; background: #fef2f2; color: #991b1b; }

    .context {
      margin-top: 12px;
      padding: 10px;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }
    .context-label { font-size: 11px; color: #64748b; font-weight: 600; }
    .context-value { font-size: 13px; color: #1e293b; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
            stroke="#2E7D5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>Cleo LinkedIn Capture</h1>
      <span>v1.0.0</span>
    </div>
  </div>

  <div class="field">
    <label>Backend URL</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:8099" />
  </div>

  <div class="field">
    <label>Auth Token (JWT)</label>
    <input type="password" id="token" placeholder="Paste token from Cleo" />
  </div>

  <button class="btn btn-primary" id="saveBtn">Save Settings</button>
  <button class="btn btn-secondary" id="testBtn">Test Connection</button>

  <div class="status" id="status"></div>

  <div class="context" id="contextBox" style="display: none">
    <div class="context-label">Current Contact Context</div>
    <div class="context-value" id="contextValue"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
